              '''// DataDisconnect tears down RNDIS or MBIM session.
func (s *ModemService) DataDisconnect(req domain.DataConnectRequest) (string, error) {
\tmode, err := domain.ParseDataMode(string(req.Mode))
\tif err != nil {
\t\treturn "", err
\t}
\tiface := strings.TrimSpace(req.Iface)
\ts.mu.RLock()
\tselectedNet, selectedMBIM := s.selectedNet, s.selectedMBIM
\tcurrentMode := s.status.WAN.Mode
\tcid := s.status.APN.CID
\ts.mu.RUnlock()

\tif iface == "" {
\t\tif mode == domain.DataModeAuto {
\t\t\tswitch currentMode {
\t\t\tcase domain.DataModeMBIM:
\t\t\t\tmode, iface = domain.DataModeMBIM, selectedMBIM
\t\t\tcase domain.DataModeRNDIS:
\t\t\t\tmode, iface = domain.DataModeRNDIS, selectedNet
\t\t\tdefault:
\t\t\t\tif selectedMBIM != "" {
\t\t\t\t\tmode, iface = domain.DataModeMBIM, selectedMBIM
\t\t\t\t} else {
\t\t\t\t\tmode, iface = domain.DataModeRNDIS, selectedNet
\t\t\t\t}
\t\t\t}
\t\t} else if mode == domain.DataModeMBIM {
\t\t\tiface = selectedMBIM
\t\t} else {
\t\t\tiface = selectedNet
\t\t}
\t}
\tif mode == domain.DataModeAuto {
\t\tif strings.HasPrefix(iface, "/dev/cdc-wdm") {
\t\t\tmode = domain.DataModeMBIM
\t\t} else if iface != "" {
\t\t\tmode = domain.DataModeRNDIS
\t\t}
\t}
\tif err := s.validateSelectedDataPath(mode, iface); err != nil {
\t\treturn "", err
\t}

\tswitch mode {
\tcase domain.DataModeRNDIS:
\t\tif s.net == nil {
\t\t\treturn "", fmt.Errorf("RNDIS net helper not configured")
\t\t}
\t\tout, err := s.net.DisconnectRNDIS(iface)
\t\tif err != nil {
\t\t\treturn out, err
\t\t}
\t\ts.markWANDisconnected(domain.DataModeRNDIS, "", iface)
\t\tif s.at != nil {
\t\t\tif cid <= 0 {
\t\t\t\tcid = appdefaults.DefaultCID
\t\t\t}
\t\t\tvar pdpErr error
\t\t\t_ = s.withAT(func() error {
\t\t\t\tpdpErr = s.at.DeactivatePDP(cid)
\t\t\t\treturn nil
\t\t\t})
\t\t\tif pdpErr != nil {
\t\t\t\treturn strings.TrimSpace(out), fmt.Errorf("host interface disconnected; PDP deactivate failed: %w", pdpErr)
\t\t\t}
\t\t}
\t\treturn out, nil
\tcase domain.DataModeMBIM:
\t\tif s.mbim == nil {
\t\t\treturn "", errModemUnavailable
\t\t}
\t\tout, err := s.mbim.Disconnect(iface)
\t\tif err == nil {
\t\t\ts.markWANDisconnected(domain.DataModeMBIM, iface, selectedNet)
\t\t}
\t\treturn out, err
\tdefault:
\t\treturn "", fmt.Errorf("unknown data mode %q", mode)
\t}
}''',
