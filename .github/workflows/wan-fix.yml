              "// connectRNDIS activates the PDP context",
              "func (s *ModemService) setWANMethod",
              '''// connectRNDIS activates the PDP context and configures the host via DHCP.
// CGPADDR is telemetry only: it does not contain a trustworthy prefix or gateway,
// so this path never paints guessed static network settings onto the host.
func (s *ModemService) connectRNDIS(iface string, rawMethod domain.DataMethod, cid int) (string, error) {
\tmethod, err := domain.ParseDataMethod(string(rawMethod))
\tif err != nil {
\t\treturn "", err
\t}
\tif method == domain.DataMethodStatic {
\t\treturn "", fmt.Errorf("static RNDIS configuration is disabled: CGPADDR does not provide a subnet prefix or gateway; use DHCP")
\t}
\tif cid <= 0 {
\t\tcid = appdefaults.DefaultCID
\t}

\tvar notes []string
\tif s.at != nil {
\t\tvar pdp domain.PDPSession
\t\tvar activateErr, queryErr error
\t\t_ = s.withAT(func() error {
\t\t\tactivateErr = s.at.ActivatePDP(cid)
\t\t\tpdp, queryErr = s.at.QueryPDP(cid)
\t\t\treturn nil
\t\t})
\t\tif activateErr != nil {
\t\t\tnotes = append(notes, "PDP activate warning: "+activateErr.Error())
\t\t}
\t\tif queryErr != nil {
\t\t\tnotes = append(notes, "PDP query warning: "+queryErr.Error())
\t\t} else {
\t\t\ts.mu.Lock()
\t\t\ts.status.PDP = pdp
\t\t\ts.status.APN.IPAddr = pdp.IP
\t\t\ts.mu.Unlock()
\t\t\tif pdp.IP != "" {
\t\t\t\tnotes = append(notes, "PDP "+pdp.IP)
\t\t\t}
\t\t}
\t}

\tout, dhcpErr := s.net.ConnectRNDIS(iface)
\tif strings.TrimSpace(out) != "" {
\t\tnotes = append(notes, strings.TrimSpace(out))
\t}
\tif dhcpErr != nil {
\t\treturn strings.TrimSpace(strings.Join(notes, "\\n")), fmt.Errorf("dhcp: %w", dhcpErr)
\t}
\tif addrs := s.net.IfaceAddrs(iface); len(addrs) == 0 {
\t\treturn strings.TrimSpace(strings.Join(notes, "\\n")), fmt.Errorf("DHCP completed but %s has no IPv4 address", iface)
\t}
\treturn strings.TrimSpace(strings.Join(notes, "\\n")), nil
}''',
