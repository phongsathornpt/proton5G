{{define "panel-cellular"}}
<section id="panel-cellular" class="panel" data-panel="cellular" hidden>
    <div class="grid">
        <section class="card full-width">
            <h2>Modem</h2>
            <div class="form-row">
                <div class="form-group grow">
                    <label for="modem-select">Device</label>
                    <select id="modem-select"></select>
                </div>
                <div class="form-group grow">
                    <label for="at-port-select">AT port</label>
                    <select id="at-port-select"></select>
                </div>
            </div>
            <div class="button-group mt-15">
                <button type="button" class="btn-primary" onclick="applyModemSelection()">Use selected</button>
                <button type="button" onclick="refreshModems()">Refresh list</button>
            </div>
            <p class="hint" id="modem-hint">Select a modem and AT port, then Use selected to connect monitoring.</p>
        </section>
        <section class="card">
            <h2>Signal &amp; network</h2>
            <div class="signal-meter">
                <div class="bar-container">
                    <div id="signal-fill" class="fill" style="width: 0%;"></div>
                </div>
                <span id="signal-pct" class="pct">0%</span>
            </div>
            <div class="info-list">
                <div class="info-item"><span>Operator:</span> <strong id="net-operator">-</strong></div>
                <div class="info-item"><span>Technology:</span> <strong id="net-tech">-</strong></div>
                <div class="info-item"><span>Registration:</span> <strong id="net-reg">-</strong></div>
                <div class="info-item"><span>RSSI:</span> <strong id="sig-rssi">-</strong></div>
                <div class="info-item"><span>RSRP:</span> <strong id="sig-rsrp">-</strong></div>
                <div class="info-item"><span>RSRQ:</span> <strong id="sig-rsrq">-</strong></div>
                <div class="info-item"><span>Serial:</span> <strong id="modem-port">-</strong></div>
                <div class="info-item"><span>Power:</span> <strong id="modem-power">-</strong></div>
            </div>
            <p id="status-error" class="error-line"></p>
        </section>
        <section class="card">
            <h2>SIM &amp; RAT</h2>
            <div class="info-list">
                <div class="info-item"><span>Status:</span> <strong id="sim-state">-</strong></div>
                <div class="info-item"><span>IMSI:</span> <strong id="sim-imsi">-</strong></div>
                <div class="info-item"><span>ICCID:</span> <strong id="sim-iccid">-</strong></div>
                <div class="info-item"><span>Preferred mode:</span> <strong id="rat-mode">-</strong></div>
            </div>
            <div class="button-group mt-15">
                <button type="button" onclick="setRAT('5g')">Force 5G</button>
                <button type="button" onclick="setRAT('lte')">Force LTE</button>
                <button type="button" onclick="setRAT('auto')">Auto mode</button>
            </div>
        </section>
    </div>
</section>
{{end}}
