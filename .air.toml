# Air live reload config for fm350-monitor.
# Docs: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/fm350-manager ./cmd/app"
  bin = "./tmp/fm350-manager"
  # Passed to the app on every run. -no-elevate plus local runtime/state dirs
  # keep live reload fully non-root (no sudo re-exec mid-reload). Run `make
  # setup` once so serial + sysfs work without root.
  args_bin = ["-no-elevate", "-bind", "0.0.0.0", "-port", "8080", "-history-file", "./.state/history.json"]
  env = ["RUNTIME_DIRECTORY=./.runtime", "STATE_DIRECTORY=./.state"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs", "deploy", ".git", ".claude", ".codex", ".agents"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"
  log = "build-errors.log"

[log]
  time = true

[screen]
  clear_on_rebuild = false

[color]
  build = "yellow"
  app = "green"
  runner = "cyan"

[misc]
  clean_on_exit = true
